# Meson cross file for targeting Windows from Linux
# This is the Octave-specific cross file, to be included before the common cross file

[binaries]
mkoctfile='/tmp/windeps/mkoctfile'

[project options]
build_for='octave'

[constants]
slicot_path='/tmp/windeps/sysroot-octave/ucrt64/lib'

[properties]
sys_root='/tmp/windeps/sysroot-octave/'
pkg_config_libdir = '/tmp/windeps/sysroot-octave/ucrt64/lib/pkgconfig'
boost_root='/tmp/windeps/sysroot-octave/ucrt64'
